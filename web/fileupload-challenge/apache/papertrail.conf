# PaperTrail — Apache configuration
# ---------------------------------------------------------------------------
# Loaded as a conf-enabled snippet on top of the stock php:8.2-apache image
# (mod_php). Sets the document root behaviour for the portal.

# Quiet the "could not reliably determine the server's fully qualified domain
# name" notice on startup.
ServerName localhost

DirectoryIndex index.php

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    # Application directory: no per-directory overrides needed here.
    AllowOverride None
    Require all granted
</Directory>

# Uploaded documents live here. The directory is writable by the web server
# and honours per-directory configuration so document folders can carry their
# own settings.
<Directory /var/www/html/uploads>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>
