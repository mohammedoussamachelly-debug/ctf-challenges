{% extends "base.html" %}
{% block content %}
<h2>Send feedback</h2>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post">
  <label for="message">Message</label>
  <textarea id="message" name="message" rows="4" required></textarea>
  <button type="submit">Submit</button>
</form>
{% endblock %}
