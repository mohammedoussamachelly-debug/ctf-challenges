{% extends "base.html" %}
{% block content %}
<h2>New note</h2>
<form method="post">
  <label for="title">Title</label>
  <input id="title" name="title" required>
  <label for="content">Content</label>
  <textarea id="content" name="content" rows="6" required></textarea>
  <button type="submit">Save</button>
</form>
{% endblock %}
